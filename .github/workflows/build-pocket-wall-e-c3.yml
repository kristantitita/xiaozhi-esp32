
name: Build Pocket Wall-E C3

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-pocket-wall-e-c3.yml"
      - "main/boards/pocket-wall-e-c3/**"
      - "main/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py pocket-wall-e-c3 --name pocket-wall-e-c3

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: pocket-wall-e-c3-firmware
          path: build/merged-binary.bin
          if-no-files-found: error
